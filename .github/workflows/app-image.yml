name: Build and Push App Image

on:
  push:
    branches: ["main"]
    paths:
      - "services/app/**"
      - ".github/workflows/app-image.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

