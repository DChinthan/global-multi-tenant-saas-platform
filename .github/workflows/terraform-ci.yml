name: Terraform CI

on:
  pull_request:
  push:
    branches: ["main", "chore/phase-0-bootstrap"]

jobs:
  validate:
    name: terraform validate (${{ matrix.env }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        env: [dev, stage, prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform init (no backend)
        run: terraform -chdir=infra/terraform/envs/${{ matrix.env }} init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra/terraform/envs/${{ matrix.env }} validate

  lint_security:
    name: fmt + tflint + tfsec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform fmt (check)
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: TFLint (per env + module)
        working-directory: infra/terraform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONFIG_PATH="$(pwd)/.tflint.hcl"
          echo "=== Using config: $CONFIG_PATH ==="
          tflint --init --config "$CONFIG_PATH"

          # Lint environment roots
          for d in envs/dev envs/stage envs/prod; do
            echo "=== tflint: $d ==="
            tflint --chdir "$d" --config "$CONFIG_PATH"
          done

          # Lint reusable modules
          for d in modules/vpc modules/rds modules/opensearch modules/kinesis; do
            echo "=== tflint: $d ==="
            tflint --chdir "$d" --config "$CONFIG_PATH"
          done

      - name: tfsec (security scan)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra/terraform
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version: v1.28.13