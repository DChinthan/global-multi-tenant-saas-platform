replicaCount: 2

image:
  repository: app5-fileservice
  tag: latest
  pullPolicy: IfNotPresent

# Consumed as the CLOUD_PROVIDER env var by services/app5-fileservice/main.py.
# Overridden per target in values-azure.yaml (and would be for a values-aws.yaml
# / values-gcp.yaml the same way) - no code or chart change needed to retarget.
cloudProvider: aws

service:
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

probes:
  healthzPath: /healthz
  readyzPath: /readyz

# Requires the Prometheus Operator CRDs (installed by kube-prometheus-stack)
# to already exist in the cluster - see helm/monitoring/. Off by default so
# this chart still installs cleanly on a bare cluster with no monitoring
# stack.
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 15s

# Mirrors the ECS Fargate autoscaling.tf pattern in modules/compute
# (min 2 / max 6, 60% CPU target) so the scaling story is consistent
# whether the service runs on ECS or Kubernetes.
autoscaling:
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
